<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM Law</title>
  <style>
    :root { --bg: #fafaf8; --fg: #1a1a1a; --muted: #666; --accent: #8a6d3b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --fg: #eee; --muted: #999; --accent: #c9a96a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif; padding: 16px; text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: .02em; }
    p { color: var(--muted); margin: .25rem 0; }
    .line { width: 60px; height: 2px; background: var(--accent); margin: 1.25rem auto; }
  </style>
</head>
<body>
  <main>
    <h1>MM Law</h1>
    <div class="line"></div>
    <p>Test page — site coming soon.</p>
    <p>mmlaw.ge</p>
  </main>
</body>
</html>
